# Deploys the Express API to Azure App Service ("anielab") on every push to
# main. Uses direct Kudu zip-deploy with publish-profile credentials — the
# app uses a new-style default domain, which azure/webapps-deploy can't handle.
name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install, build, prune
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: Zip the app
        run: zip -qr app.zip . -x ".git/*" -x "app.zip"

      - name: Zip-deploy to Kudu
        env:
          SCM_USER: ${{ secrets.AZURE_SCM_USER }}
          SCM_PASS: ${{ secrets.AZURE_SCM_PASS }}
        run: |
          STATUS=$(curl -s -u "$SCM_USER:$SCM_PASS" \
            -X POST "https://anielab-ghgbd4dtckbtf9d4.scm.southafricanorth-01.azurewebsites.net/api/zipdeploy" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            --max-time 900 \
            -o kudu-response.txt \
            -w "%{http_code}")
          echo "HTTP $STATUS"
          cat kudu-response.txt || true
          if [ "$STATUS" != "200" ]; then exit 1; fi
